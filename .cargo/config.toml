# Intentionally minimal. Retained as an obvious home for any future
# fork-specific cargo config. The canonical local build is plain
# `cargo build --release` against the default `stable-x86_64-pc-windows-msvc`
# toolchain (see ADR-013 in DECISIONS.md); no cargo config overrides are
# needed for it. Earlier revisions pinned `WINRES_TOOLCHAIN` for the now-
# retired gnullvm path — preserved in ADR-005 Appendix A if ever needed.
