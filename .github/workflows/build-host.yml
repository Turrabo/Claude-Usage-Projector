name: build-host

# Build the Rust host binary on every push (any branch, including main) and
# on manual dispatch. Builds on main are the canonical regression-catcher
# for changes that landed via direct push; previously this trigger ignored
# main, which masked a USER32 0x35532 regression for several days in May
# 2026 (see ADR-013).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy
        run: cargo clippy --release --all-targets -- -D warnings
        continue-on-error: true

      - name: cargo build --release
        run: cargo build --release

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccum-host-${{ github.sha }}
          path: target/release/*.exe
          retention-days: 14
