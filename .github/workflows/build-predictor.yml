name: build-predictor

# Build the C# predictor sidecar binary on every push (any branch, including
# main) that touches the predictor or this workflow file, and on manual
# dispatch. Builds on main catch regressions from direct-push changes
# (previously this trigger ignored main — see ADR-013).
# Self-contained single-file publish (no AOT, no MSVC dependency).
# Artifact is the ~36 MB ccum-predictor.exe.

on:
  push:
    paths:
      - 'predictor/**'
      - '.github/workflows/build-predictor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: predictor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: dotnet restore
        run: dotnet restore predictor.sln

      - name: dotnet build
        run: dotnet build predictor.sln -c Release --no-restore

      - name: dotnet test
        run: dotnet test predictor.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: dotnet publish (self-contained single-file)
        run: dotnet publish Predictor.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true --no-restore

      - name: Upload predictor artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccum-predictor-${{ github.sha }}
          path: predictor/bin/Release/net9.0/win-x64/publish/ccum-predictor.exe
          retention-days: 14
